services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/twitter_clone?sslmode=disable
      - PLATFORM=dev
      - JWT_SECRET=your-jwt-secret-key
      - POLKA_KEY=your-polka-key
      - PORT=8080
    volumes:
      - ./assets:/app/assets

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=twitter_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
